<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RSVP Reader Icon</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon {
    width: 192px;
    height: 192px;
    border-radius: 42px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  }

  .word {
    color: #ff2b2b;
    font-weight: 800;
    font-size: 96px;
    letter-spacing: -1px;
    text-shadow: 0 0 18px rgba(255,43,43,0.55);
  }
</style>
</head>
<body>

  <div class="icon">
    <span class="word">YS</span>
  </div>

</body>
</html>
